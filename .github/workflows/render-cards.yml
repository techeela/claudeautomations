name: Render LinkedIn cards

on:
  push:
    paths:
      - "specs/**.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-dejavu-core || sudo apt-get install -y -qq fonts-dejavu-core
          pip install -q pillow
      - name: Render new or changed cards
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)
          for spec in specs/*.json; do
            name=$(basename "$spec" .json)
            if [ ! -f "cards/$name.png" ] || echo "$CHANGED" | grep -qxF "$spec"; then
              python render.py "$spec"
            fi
          done
      - name: Commit cards
        run: |
          git config user.name "card-bot"
          git config user.email "card-bot@users.noreply.github.com"
          git add cards/
          git diff --cached --quiet || (git commit -m "Render cards" && git push)
